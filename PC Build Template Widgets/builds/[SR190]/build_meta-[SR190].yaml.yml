# 10-performance-graph-widget
performance_widget:
  widget_id_suffix: "..."
  kicker: "Performance Snapshot"
  title: "Multi-Game Average FPS"
  driver_bar:
    type: "nvidia" # gpu|amd|nvidia
    driver_text: "Driver Version: ..."
  fps_input_mode: "single_line_results"
  raw_results:
    - "Arc Raiders - 108.7 FPS (@1440p High)"
    - "Battlefield 6 - 119 FPS (@1440p High)"
    - "Cyberpunk 2077 - 148.1 FPS (@1440p High)"
    - "F1 25 - 194.9 FPS (@4K High)"
    - "Marvel Rivals - 85 FPS (@4K High)"
    - "Fortnite - 295.4 FPS (@1080p Comp)"
  strict_mode: true
  rules:
    keep_only_listed_games: true
    remove_unlisted_games: true
    keep_only_listed_resolutions_per_game: true
    remove_unlisted_resolutions_per_game: true
  settings_policy:
    preserve_default_settings: true
    override_only_if_provided: true
  default_settings_locked:
    arcraiders: []
    marvelrivals: []
    battlefield6: []
    callofduty: []
    fortnite: []
    cyberpunk2077: []
    hogwartslegacy: []
    f125: []

