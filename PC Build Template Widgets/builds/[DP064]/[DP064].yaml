      - { label: "Form Factor", value: "ATX (30.5 x 24.4 cm)" }
      - { label: "Memory", value: "4 x DDR5 (up to 256GB)" }
      - { label: "Storage", value: "3 x M.2 + 4 x SATA" }
      - { label: "Networking", value: "Wi-Fi 7 + 2.5GbE + BT 5.4" }
    buy_shortcode: '[geeka_price AMAZON-GENIUS-HREF="https://geni.us/uN74G5" AMAZON-US-ASIN="B0DPLPLR88" AMAZON-GB-ASIN="B0DPLPLR88" overclockers-awin-gb-href="https://www.awin1.com/cread.php?awinmid=28821&awinaffid=1167182&ued=https%3A%2F%2Fwww.overclockers.co.uk%2Fasus-tuf-gaming-b850-plus-wifi-socket-am5-ddr5-atx-motherboard-mot-asu-03844.html" overclockers-awin-gb-itemid="MOT-ASU-03844"]'                                         # paste full geeka_price shortcode including brackets

  - part_key: "ram"
    tab_label: "__AUTO_FROM_PART_KEY__"
    name: "TeamGroup T-FORCE DELTA RGB DDR5"
    section_anchor: "__AUTO_FROM_PART_KEY__"
