    section_anchor: "__AUTO_FROM_PART_KEY__"
    image_url: 'https://geekawhat.com/wp-content/uploads/2025/08/MPI_ASUS-TUF-Gaming-B850-PLUS-WIFI-2.jpg'                                             # paste image URL
    image_alt: "ASUS TUF Gaming B850-PLUS WIFI"
    summary: "A full-size AM5 TUF board built around the AMD B850 chipset, offering PCIe 5.0 expansion, multiple M.2 slots, and modern networking for a high-end gaming build."
