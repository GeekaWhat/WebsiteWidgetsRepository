    name: "AMD Ryzen 7 7800X3D"
    section_anchor: "__AUTO_FROM_PART_KEY__"
    image_url: 'https://geekawhat.com/wp-content/uploads/2025/09/MPI_AMD-Ryzen-7-7800X3D.jpg'                                             # required: paste image URL
    image_alt: "AMD Ryzen 7 7800X3D"                           # required alt text
    summary: "A gaming-focused 8-core CPU with 3D V-Cache that boosts frame rates in many titles while keeping AM5 upgrade options open."
    specs:
      - { label: "Architecture", value: "Zen 4 (AM5)" }
      - { label: "Cores / Threads", value: "8 / 16" }
      - { label: "Base / Boost", value: "4.2 GHz / up to 5.0 GHz" }
      - { label: "Default TDP", value: "120W" }
      - { label: "Total Cache", value: "104MB (L2+L3)" }
    buy_shortcode: '[geeka_price AMAZON-GENIUS-HREF="https://geni.us/7kss" AMAZON-US-ASIN="B0BTZB7F88" AMAZON-GB-ASIN="B0BTZB7F88" overclockers-awin-gb-href="https://www.awin1.com/cread.php?awinmid=28821&awinaffid=1167182&ued=https%3A%2F%2Fwww.overclockers.co.uk%2Famd-ryzen-7-7800x3d-eight-core-5.00ghz-socket-am5-processor-retail-cp-3dt-am.html" overclockers-awin-gb-itemid="CP-3DT-AM"]'                                         # paste full geeka_price shortcode including brackets

  - part_key: "cpu_cooler"
    tab_label: "__AUTO_FROM_PART_KEY__"
    name: "ASUS Prime LC 360 ARGB"
    section_anchor: "__AUTO_FROM_PART_KEY__"
