build_meta:
  build_code: "[DP064]"
  refresh_scope: "full"                                       # full | partial
  notes: "..."

formatting_defaults:
  multi_value_separator: "<br>"
  no_commas_for_multi_value_lists: true
  list_item_style: "yaml_array"

part_key_rules:
  allowed_keys: ["cpu","cpu_cooler","motherboard","ram","ssd","gpu","case","psu"]
  tab_label_mode: "auto_from_part_key"                        # set tab_label to "__AUTO_FROM_PART_KEY__" unless override is needed
  section_anchor_mode: "auto_from_part_key"                   # set section_anchor to "__AUTO_FROM_PART_KEY__" unless override is needed
  anchor_style: "lowercase-kebab"                             # examples: #cpu, #cpu-cooler, #motherboard

sources:
  # shared source definitions; reuse via source_ref in widget sections
  # example:
  # motherboard_main:
  #   model: "MSI MAG X870E GAMING PLUS MAX WIFI"
  #   source_url: "https://www.msi.com/Motherboard/MAG-X870E-GAMING-PLUS-MAX-WIFI/Specification"

widget_enabled:
  cpu_comparison_table: false
  cooler_temps_graph: true
  motherboard_specs: true
  ram_widget: true
  ssd_widget: true
  gpu_comparison_table: false
  case_specs: true
  psu_connectors: true
  performance_widget: false
  peripherals: false

# 00-pc-build-component-headings
component_headings:
  cpu: "AMD Ryzen 7 7800X3D"
  cpu_cooler: "ASUS Prime LC 360 ARGB"
  motherboard: "ASUS TUF Gaming B850-PLUS WIFI"
  ram: "TeamGroup T-FORCE DELTA RGB DDR5"
  ssd: "TeamGroup MP44L 1TB"
  gpu: "ASUS Prime Radeon RX 9070 XT OC Edition 16GB"
  case: "ASUS Prime AP303"
  psu: "Corsair RM750e (2025)"

# 01-pc-build-parts-list
parts_list:
