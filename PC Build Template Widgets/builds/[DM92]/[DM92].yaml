# 10-performance-graph-widget
performance_widget:
  enabled: true
  # widget_id_suffix: '' # optional: leave omitted unless you want a custom HTML id
  kicker: "Performance Snapshot"
  title: "Multi-Game Average FPS"
  driver_bar:
    type: "nvidia"                                               # gpu|amd|nvidia
    driver_text: "Driver Version: NVIDIA (capture build)"
  fps_input_mode: "single_line_results"
  raw_results:
    - "CyberPunk 2077 - 89 FPS (@4K High)"
    - "Marvel Rivals - 88.4 FPS (@4K High)"
    - "RESIDENT EVIL Requiem - 91.9 FPS (@4K High)"
    - "Battlefield 6 - 93.8 FPS (@4K High)"
    - "Arc Raiders - 112.4 FPS (@4K High)"
    - "Fortnite - 326.5 FPS (@1080p Competitive)"
  strict_mode: true
  rules:
    # Always remove games and/or resolutions that are not present in raw_results.
    keep_only_listed_games: true
    remove_unlisted_games: true
    keep_only_listed_resolutions_per_game: true
    remove_unlisted_resolutions_per_game: true
  settings_policy:
    preserve_default_settings: true
    override_only_if_provided: true
  default_settings_locked:
    arcraiders: []
    marvelrivals: []
    battlefield6: []
    callofduty: []
    fortnite: []
    cyberpunk2077: []
    hogwartslegacy: []
    f125: []

