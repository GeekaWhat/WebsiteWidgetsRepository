<style>
  .gw-testing-widget {
    width: 100%;
    margin: 18px 0;
    padding: 18px;
    border-radius: 16px;
    background: #ffffff;
    box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
    border: 1px solid rgba(0, 0, 0, 0.06);
    box-sizing: border-box;
  }
  .gw-testing-header {
    margin: -18px -18px 14px;
    padding: 10px 14px;
    border-radius: 16px 16px 0 0;
    background: #037cff;
    color: #ffffff;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .gw-testing-title {
    margin: 2px 0 10px;
    font-size: 1.9rem;
    line-height: 1.25;
    font-weight: 700;
  }
  .gw-testing-title a {
    color: inherit;
    text-decoration: none;
  }
  .gw-testing-title a:hover,
  .gw-testing-title a:focus {
    text-decoration: underline;
  }
  .gw-testing-controls {
    display: flex;
    gap: 8px;
    justify-content: space-between;
    margin: 0 0 10px;
  }
  .gw-testing-nav {
    border: 1px solid #037cff;
    background: #ffffff;
    color: #037cff;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 0.84rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
  }
  .gw-testing-nav:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .gw-testing-nav:hover,
  .gw-testing-nav:focus {
    background: rgba(3, 124, 255, 0.08);
  }
  .gw-testing-carousel {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 100%;
    gap: 10px;
    overflow-x: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
    margin-bottom: 12px;
  }
  .gw-test-slide {
    scroll-snap-align: start;
    border-radius: 12px;
    border: 1px solid #d9e8ff;
    background: #f7faff;
    padding: 12px;
    min-height: 220px;
    box-sizing: border-box;
  }
  .gw-test-embed {
    height: 100%;
    min-height: 370px;
    border: 1px solid #d9e8ff;
    border-radius: 10px;
    background: #ffffff;
    padding: 10px 10px 6px;
    box-sizing: border-box;
  }
  .gw-test-chart-title {
    margin: 0 0 8px;
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.2;
    text-align: center;
  }
  .gw-test-note {
    margin: 8px 0 0;
    font-size: 0.78rem;
    line-height: 1.25;
    opacity: 0.72;
    text-align: center;
  }
  .gw-test-canvas-wrap {
    height: 330px;
    position: relative;
  }
  .gw-chart-fullscreen {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 3;
    border: 1px solid #000000;
    background: #000000;
    color: #ffffff;
    border-radius: 7px;
    width: 34px;
    height: 28px;
    padding: 0;
    font-weight: 700;
    line-height: 1.1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .gw-chart-fullscreen::before {
    content: "⛶";
    font-size: 14px;
    line-height: 1;
  }
  .gw-chart-fullscreen.is-active {
    background: #ffffff;
    color: #000000;
    border-color: #000000;
  }
  .gw-test-embed:fullscreen {
    background: #ffffff;
    padding: 14px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .gw-test-embed:fullscreen .gw-test-canvas-wrap {
    flex: 1 1 auto;
    height: auto;
    min-height: 0;
  }
  .gw-test-embed:fullscreen canvas {
    width: 100% !important;
    height: 100% !important;
  }
  .gw-testing-cta {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #037cff;
    background: #037cff;
    color: #ffffff;
    font-weight: 700;
    font-size: 0.9rem;
    text-decoration: none;
  }
  .gw-testing-cta:hover,
  .gw-testing-cta:focus {
    background: #026fe5;
    border-color: #026fe5;
  }
  @media (max-width: 700px) {
    .gw-testing-widget {
      padding: 14px;
      border-radius: 14px;
    }
    .gw-testing-header {
      margin: -14px -14px 12px;
      border-radius: 14px 14px 0 0;
    }
    .gw-test-slide {
      min-height: 200px;
      padding: 10px;
    }
    .gw-test-embed {
      min-height: 300px;
    }
    .gw-test-canvas-wrap {
      height: 260px;
    }
  }
</style>

<section class="gw-testing-widget" id="gw-cooler-testing-widget-v2" aria-label="CPU cooler testing carousel">
  <p class="gw-testing-header">From Our Full Review</p>

  <h3 class="gw-testing-title">
    <a href="https://geekawhat.com/corsair-nautilus-360-rs-argb-cpu-cooler-review/" target="_blank" rel="noopener noreferrer">CPU Cooler Testing</a>
  </h3>

  <div class="gw-testing-controls" aria-label="Carousel navigation">
    <button type="button" class="gw-testing-nav gw-testing-prev" aria-label="Previous graph">← Previous Graph</button>
    <button type="button" class="gw-testing-nav gw-testing-next" aria-label="Next graph">Next Graph →</button>
  </div>

  <div class="gw-testing-carousel" aria-label="CPU cooler test charts carousel">
    <article class="gw-test-slide">
      <div class="gw-test-embed">

    <article class="gw-test-slide">
      <div class="gw-test-embed">

        <p class="gw-test-note">Lower is better. Highlighted unit: Corsair NAUTILUS 360 RS ARGB.</p>
        <div class="gw-test-canvas-wrap">
          <button type="button" class="gw-chart-fullscreen" aria-label="View CPU-Z chart fullscreen"></button>
          <canvas class="gw-cpuz-chart" aria-label="CPU-Z 8 thread temperatures"></canvas>
        </div>
      </div>
    </article>
  </div>

  <a class="gw-testing-cta" href="https://geekawhat.com/corsair-nautilus-360-rs-argb-cpu-cooler-review/" target="_blank" rel="noopener noreferrer">See Full Testing</a>
</section>

<script>
  (function () {
    var scriptEl = document.currentScript;
    var root = scriptEl ? scriptEl.previousElementSibling : null;
    if (!root || !root.classList || !root.classList.contains("gw-testing-widget")) {
      root = document.getElementById("gw-cooler-testing-widget-v2");
    }
    if (!root) return;

    function ensureChartJs(done) {
      if (typeof Chart !== "undefined") {
        done();
        return;
      }
      var existing = document.querySelector('script[data-gw-chartjs="1"]');
      if (existing) {
        existing.addEventListener("load", done, { once: true });
        return;
      }
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/chart.js";
      s.async = true;
      s.setAttribute("data-gw-chartjs", "1");
      s.addEventListener("load", done, { once: true });
      document.head.appendChild(s);
    }

    function init() {
      if (root.getAttribute("data-gw-init") === "1") return;
      if (typeof Chart === "undefined") return;
      root.setAttribute("data-gw-init", "1");

      var highlightName = "Corsair Nautilus 360 RS ARGB";

    var cinebenchLabels = [
      "Montech HyperFlow ARGB 360",
      "Montech HyperFlow DIGITAL 360",
      "Endorfy Navis F360 RGB",
      "be quiet! Pure Loop 2 360mm",
      "be quiet! Light Loop 360mm",
      "MSI MAG CoreLiquid A15 360",
      "Cougar Poseidon Vistek Pro ARGB 360",
      "DeepCool MYSTIQUE 360",
      "MPG CORELIQUID P13 360",
      "NZXT Kraken Elite 360 RGB V2 (2024)",
      "ASUS ROG STRIX LC III 360 ARGB",
      "Corsair Nautilus 360 RS ARGB",
      "ASUS PRIME LC 360 ARGB",
      "Valkyrie V360 LCD",
      "Corsair iCUE LINK TITAN 360 RX",
      "Cooler Master MasterLiquid 360 Atmos",
      "MSI MAG CoreLiquid E360",
      "MSI MAG CoreLiquid I360",
      "DeepCool LT720",
      "DeepCool LE720",
      "Lian Li GA II Trinity 360",
      "Fractal Lumen S36 ARGB",
      "Corsair iCUE LINK H150i LCD",
      "SAMA L70",
      "Thermaltake MINECUBE 360 Ultra ARGB Sync",
      "NZXT Kraken 360"
    ];
    var cinebenchAvg = [58,58,59,59,60,60,60,60,60,60,60,60,60,61,61,61,61,62,63,63,63,64,64,65,66,67];
    var cinebenchMax = [63,64,65,67,65,65,67,67,67,67,68,68,69,65,68,69,70,70,73,74,74,72,74,67,74,72];

    var cpuzLabels = [
      "be quiet! Pure Loop 2 360mm",
      "Montech HyperFlow ARGB 360",
      "Antec Vortex Lum 360 RGB",
      "Arctic Liquid Freezer III 360 Pro",
      "Endorfy Navis F360 RGB",
      "MSI MAG CoreLiquid A15 360",
      "MPG CORELIQUID P13 360",
      "Corsair Nautilus 360 RS ARGB",
      "Cooler Master MasterLiquid 360 Atmos",
      "be quiet! Light Loop 360mm",
      "ASUS ROG STRIX LC III 360 ARGB",
      "ASUS PRIME LC 360 ARGB",
      "Cougar Poseidon Vistek Pro ARGB 360",
      "Corsair iCUE LINK TITAN 360 RX",
      "DeepCool Mystique 360",
      "MSI MAG CoreLiquid I360",
      "Thermaltake MINECUBE 360 Ultra ARGB Sync",
      "Lian Li GA II Trinity 360",
      "DeepCool LT720",
      "DeepCool LE720",
      "Fractal Lumen S36 ARGB",
      "NZXT Kraken Elite 360 RGB V2 (2024)",
      "Corsair iCUE LINK H150i LCD",
      "SAMA L70",
      "MSI MAG CoreLiquid E360",
      "NZXT Kraken 360"
    ];
    var cpuzAvg = [69,69,69,69,69,70,70,70,70,70,71,72,72,72,72,72,73,73,74,74,74,76,77,78,78,82];
    var cpuzMax = [72,72,74,75,75,72,73,73,75,77,77,75,75,79,79,80,75,79,79,81,82,78,84,80,86,85];

    function colorByHighlight(labels, focus, base, hi) {
      return labels.map(function (n) { return n === focus ? hi : base; });
    }

    function chartOptions() {
      return {
        indexAxis: "y",
        maintainAspectRatio: false,
        responsive: true,
        plugins: {
          legend: { position: "bottom" },
          tooltip: {
            callbacks: {
              label: function (ctx) { return ctx.dataset.label + ": " + ctx.parsed.x + "°C"; }
            }
          }
        },
        scales: {
          x: {
            beginAtZero: true,
            ticks: { callback: function (v) { return v + "°C"; }, font: { size: 10 } },
            grid: { color: "rgba(0,0,0,0.08)" }
          },
          y: {
            ticks: { autoSkip: false, font: { size: 10 } },
            grid: { display: false }
          }
        }
      };
    }

    function setChartHeight(canvas, rows) {
      var wrap = canvas && canvas.closest(".gw-test-canvas-wrap");
      if (!wrap) return;
      var minHeight = 330;
      var perRow = 18;
      var target = Math.max(minHeight, rows * perRow + 70);
      wrap.style.height = target + "px";
    }

      var cineCtx = root.querySelector(".gw-cinebench-chart");
      if (cineCtx) {
        setChartHeight(cineCtx, cinebenchLabels.length);
        new Chart(cineCtx, {
        type: "bar",
        data: {
          labels: cinebenchLabels,
          datasets: [
            {
              label: "Average Temp",
              data: cinebenchAvg,
              backgroundColor: colorByHighlight(cinebenchLabels, highlightName, "#3c8dff", "#7c3aed")
            },
            {
              label: "Max Temp",
              data: cinebenchMax,
              backgroundColor: colorByHighlight(cinebenchLabels, highlightName, "#8fc0ff", "#a06cf5")
            }
          ]
        },
        options: chartOptions()
        });
      }

      var cpuzCtx = root.querySelector(".gw-cpuz-chart");
      if (cpuzCtx) {
        setChartHeight(cpuzCtx, cpuzLabels.length);
        new Chart(cpuzCtx, {
        type: "bar",
        data: {
          labels: cpuzLabels,
          datasets: [
            {
              label: "Average Temp",
              data: cpuzAvg,
              backgroundColor: colorByHighlight(cpuzLabels, highlightName, "#3c8dff", "#7c3aed")
            },
            {
              label: "Max Temp",
              data: cpuzMax,
              backgroundColor: colorByHighlight(cpuzLabels, highlightName, "#8fc0ff", "#a06cf5")
            }
          ]
        },
        options: chartOptions()
        });
      }

      var carousel = root.querySelector(".gw-testing-carousel");
      var slides = carousel ? Array.prototype.slice.call(carousel.querySelectorAll(".gw-test-slide")) : [];
      var prevBtn = root.querySelector(".gw-testing-prev");
      var nextBtn = root.querySelector(".gw-testing-next");
      var idx = 0;

      function updateNav() {
        if (!prevBtn || !nextBtn) return;
        prevBtn.disabled = idx <= 0;
        nextBtn.disabled = idx >= slides.length - 1;
      }

      function goTo(i) {
        idx = Math.max(0, Math.min(slides.length - 1, i));
        if (slides[idx]) slides[idx].scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
        updateNav();
      }

      if (carousel && prevBtn && nextBtn) {
        prevBtn.addEventListener("click", function () { goTo(idx - 1); });
        nextBtn.addEventListener("click", function () { goTo(idx + 1); });
        updateNav();
      }

      function enterFullscreen(el) {
        if (el.requestFullscreen) return el.requestFullscreen();
        if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
        return Promise.resolve();
      }
      function exitFullscreen() {
        if (document.exitFullscreen) return document.exitFullscreen();
        if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
        return Promise.resolve();
      }

      var fsButtons = root.querySelectorAll(".gw-chart-fullscreen");
      fsButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          var panel = btn.closest(".gw-test-embed");
          if (!panel) return;
          var open = document.fullscreenElement === panel || document.webkitFullscreenElement === panel;
          if (open) exitFullscreen(); else enterFullscreen(panel);
        });
      });

    function syncFs() {
      var active = document.fullscreenElement || document.webkitFullscreenElement;
      fsButtons.forEach(function (btn) {
        var panel = btn.closest(".gw-test-embed");
        var on = panel && active === panel;
        btn.classList.toggle("is-active", !!on);
        btn.setAttribute("title", on ? "Exit fullscreen" : "View chart fullscreen");
      });
    }
      document.addEventListener("fullscreenchange", syncFs);
      document.addEventListener("webkitfullscreenchange", syncFs);
      syncFs();
    }

    ensureChartJs(init);
  })();
</script>
<!-- /wp:html -->
