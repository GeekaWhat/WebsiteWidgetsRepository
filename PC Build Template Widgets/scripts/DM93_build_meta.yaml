      - { label: "Cooler Type", value: "360mm AIO Liquid Cooler" }
      - { label: "Fans", value: "3 x RS120 ARGB PWM" }
      - { label: "Socket Support", value: "AM5 / AM4 / LGA1851 / LGA1700" }
      - { label: "Control", value: "Direct motherboard PWM + ARGB" }
    buy_shortcode: '[geeka_price AMAZON-GENIUS-HREF="https://geni.us/eqsQEB" AMAZON-US-ASIN="B0DF7C4YPQ" AMAZON-GB-ASIN="B0DF7C4YPQ" overclockers-awin-gb-href="https://www.awin1.com/cread.php?awinmid=28821&awinaffid=1167182&ued=https%3A%2F%2Fwww.overclockers.co.uk%2Fcorsair-nautilus-360-rs-argb-all-in-one-cpu-cooler-360mm-coo-crs-03511.html%3F_gl%3D1%2A1rtomx5%2A_up%2AMQ..%2A_gs%2AMQ..%26gclid%3DCjwKCAjw88yxBhBWEiwA7cm6pUaGLINOoTnXMXXNULHQDnW-L6Dmiqd7Bys2SxdjXYegU5glFKU0ghoC2V0QAvD_BwE" overclockers-awin-gb-itemid="COO-CRS-03511"]'

  - part_key: "motherboard"
    tab_label: "__AUTO_FROM_PART_KEY__"
    name: "MSI PRO B850-P WIFI"
    section_anchor: "__AUTO_FROM_PART_KEY__"
    image_url: 'https://geekawhat.com/wp-content/uploads/2026/03/MPI_MSI-PRO-B850-P-WIFI.jpg'
    image_alt: "MSI PRO B850-P WIFI ATX motherboard"
    summary: "MSI's PRO B850-P WIFI gives this AM5 build a sensible feature set, combining PCIe 5.0 graphics support, multiple M.2 slots, 5G LAN, and Wi-Fi 7 + Bluetooth 5.4 on a full-size ATX board."
    specs:
      - { label: "Chipset", value: "AMD B850" }
      - { label: "Form Factor", value: "ATX" }
      - { label: "Memory Support", value: "DDR5 up to 256GB / 8200+ MT/s (OC)" }
      - { label: "Networking", value: "5G LAN, Wi-Fi 7 + Bluetooth 5.4" }
    buy_shortcode: '[geeka_price AMAZON-GENIUS-HREF="https://geni.us/J5dAr" AMAZON-US-ASIN="B0BVWB869H" AMAZON-GB-ASIN="B0BVWB869H" overclockers-awin-gb-href="https://www.awin1.com/cread.php?awinmid=28821&awinaffid=1167182&ued=https%3A%2F%2Fwww.overclockers.co.uk%2Fmsi-pro-b850-p-wifi-amd-am5-b850-atx-motherboard-mot-msi-03995.html" overclockers-awin-gb-itemid="MOT-MSI-03995"]'

  - part_key: "ram"
    tab_label: "__AUTO_FROM_PART_KEY__"
    name: "CORSAIR VENGEANCE RGB DDR5"
    section_anchor: "__AUTO_FROM_PART_KEY__"
    image_url: 'https://geekawhat.com/wp-content/uploads/2023/12/MPI_Corsair-Vengeance-RGB-DDR5-For-AMD.jpg'
    image_alt: "Corsair VENGEANCE RGB DDR5 memory kit"
    summary: "This VENGEANCE RGB DDR5 kit hits a familiar AM5 sweet spot with a 32GB capacity, 6000MT/s speed, and AMD EXPO support, while adding Corsair's panoramic RGB light bar."
    specs:
      - { label: "Capacity", value: "32GB (2 x 16GB)" }
      - { label: "Speed", value: "DDR5-6000" }
      - { label: "Latency", value: "CL36" }
      - { label: "Profile", value: "AMD EXPO" }
    buy_shortcode: '[geeka_price AMAZON-GENIUS-HREF="https://geni.us/fAixlVt" AMAZON-US-ASIN="B0BZHTVHN5" AMAZON-GB-ASIN="B0BZHTVHN5" overclockers-awin-gb-href="https://www.awin1.com/cread.php?awinmid=28821&awinaffid=1167182&ued=https%3A%2F%2Fwww.overclockers.co.uk%2Fcorsair-vengeance-rgb-expo-32gb-2x16gb-ddr5-pc5-48000c36-6000mhz-dual-cha-mem-crs-00997.html" overclockers-awin-gb-itemid="MEM-CRS-00997"]'

  - part_key: "ssd"
    tab_label: "__AUTO_FROM_PART_KEY__"
    name: "TeamGroup NV5000"
    section_anchor: "__AUTO_FROM_PART_KEY__"
    image_url: 'https://geekawhat.com/wp-content/uploads/2026/03/MPI_TeamGroup-NV5000.jpg'
    image_alt: "TeamGroup NV5000 PCIe 4.0 NVMe SSD"
    summary: "TeamGroup's NV5000 is an entry-level PCIe 4.0 NVMe drive aimed at straightforward gaming builds, offering enough throughput for a snappy OS and game library without demanding a premium budget."
    specs:
      - { label: "Capacity", value: "1TB" }
      - { label: "Interface", value: "PCIe 4.0 x4 / NVMe" }
      - { label: "Sequential Read", value: "Up to 4,500 MB/s" }
      - { label: "Sequential Write", value: "Up to 1,900 MB/s" }
    buy_shortcode: '[geeka_price AMAZON-GENIUS-HREF="https://geni.us/liAdy" AMAZON-US-ASIN="B0FCS69ZZJ" AMAZON-GB-ASIN="B0FCS69ZZJ" overclockers-awin-gb-href="https://www.awin1.com/cread.php?awinmid=28821&awinaffid=1167182&ued=https%3A%2F%2Fwww.overclockers.co.uk%2Fteam-group-nv5000-1tb-ssd-m.2-2280-nvme-pcie-4.0-solid-state-drive-sto-tmg-07234.html" overclockers-awin-gb-itemid="STO-TMG-07234"]'

  - part_key: "gpu"
    tab_label: "__AUTO_FROM_PART_KEY__"
    name: "PowerColor Reaper RX 9070 16GB"
    section_anchor: "__AUTO_FROM_PART_KEY__"
    image_url: 'https://geekawhat.com/wp-content/uploads/2026/03/MPI_PowerColor-Reaper-RX-9070-16GB.jpg'
    image_alt: "PowerColor Reaper Radeon RX 9070 16GB graphics card"
    summary: "PowerColor's Reaper RX 9070 is the graphics centerpiece here, bringing 16GB of GDDR6 memory, a compact dual-slot design, and the raster performance expected from a modern 1440p-focused Radeon card."
    specs:
      - { label: "VRAM", value: "16GB GDDR6" }
      - { label: "Boost Clock", value: "Up to 2520MHz" }
      - { label: "Bus Interface", value: "PCIe 5.0 x16" }
      - { label: "Power Connectors", value: "2 x 8-pin PCIe" }
    buy_shortcode: '[geeka_price AMAZON-GENIUS-HREF="https://geni.us/ciNNWh" AMAZON-US-ASIN="B0DSWL46CF" AMAZON-GB-ASIN="B0DSWL46CF" overclockers-awin-gb-href="https://www.awin1.com/cread.php?awinmid=28821&awinaffid=1167182&ued=https%3A%2F%2Fwww.overclockers.co.uk%2Fpowercolor-radeon-rx-9070-reaper-16gb-gddr6-pci-express-graphics-card-gra-pwc-04020.html" overclockers-awin-gb-itemid="GRA-PWC-04020"]'

  - part_key: "case"
    tab_label: "__AUTO_FROM_PART_KEY__"
    name: "Corsair 3200D"
    section_anchor: "__AUTO_FROM_PART_KEY__"
    image_url: 'https://geekawhat.com/wp-content/uploads/2026/03/MPI_Corsair-3200D.jpg'
    image_alt: "Corsair 3200D mid-tower PC case"
    summary: "Corsair's 3200D focuses on airflow and easy building, with roof radiator support, direct GPU airflow from the angled PSU shroud fan mount, and tidy cable routing for a clean gaming PC build."
    specs:
      - { label: "Case Type", value: "Mid Tower" }
      - { label: "Motherboard Support", value: "Reverse-connector boards supported" }
      - { label: "Cooling", value: "Supports up to a 360mm roof radiator" }
      - { label: "Included Fans", value: "3 x RS120 fans included" }
    buy_shortcode: ''

  - part_key: "psu"
    tab_label: "__AUTO_FROM_PART_KEY__"
    name: "Corsair RM650e"
    section_anchor: "__AUTO_FROM_PART_KEY__"
    image_url: 'https://geekawhat.com/wp-content/uploads/2025/04/MPI_Corsair-RM650e-with-box.jpg'
    image_alt: "Corsair RM650e modular power supply"
    summary: "Corsair's RM650e rounds the build out with a compact fully modular design, ATX 3.1 readiness, and enough modern GPU cabling flexibility to support this Radeon system cleanly."
    specs:
      - { label: "Output", value: "650W" }
      - { label: "Efficiency", value: "80 Plus Gold" }
      - { label: "Standard", value: "ATX 3.1 / PCIe 5.1" }
      - { label: "Design", value: "Fully Modular" }
    buy_shortcode: '[geeka_price AMAZON-GENIUS-HREF="https://geni.us/uiLgpL" AMAZON-US-ASIN="B0DPR6YG4V" AMAZON-GB-ASIN="B0DMTPFW3J" overclockers-awin-gb-href="https://www.awin1.com/cread.php?awinmid=28821&awinaffid=1167182&ued=https%3A%2F%2Fwww.overclockers.co.uk%2Fcorsair-rme-series-rm650e-fully-modular-atx-3.1-power-supply-pow-crs-06103.html" overclockers-awin-gb-itemid="POW-CRS-06103"]'

