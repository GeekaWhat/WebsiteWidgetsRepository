build_meta:
  build_code: "[DM93]"
  refresh_scope: "full"
  auto_fill_from_sources: true
  auto_fill_policy: "always"
  auto_fill_notes: "Auto-fill any '...' placeholders unless explicitly overridden."
  notes: "Auto-filled active widget fields from official AMD, MSI, Corsair, TeamGroup, and PowerColor product sources."

formatting_defaults:
  multi_value_separator: "<br>"
  no_commas_for_multi_value_lists: true
  list_item_style: "yaml_array"

part_key_rules:
  allowed_keys: ["cpu","cpu_cooler","motherboard","ram","ssd","gpu","case","psu"]
  tab_label_mode: "auto_from_part_key"
  section_anchor_mode: "auto_from_part_key"
  anchor_style: "lowercase-kebab"

sources:
  # shared source definitions; reuse via source_ref in widget sections

widget_enabled:
  cpu_comparison_table: false
  cooler_temps_graph: true
  motherboard_specs: true
  ram_widget: false
  ssd_widget: true
  gpu_comparison_table: false
  case_specs: false
  psu_connectors: true
  performance_widget: false
  peripherals: false

component_headings:
  cpu: "AMD Ryzen 5 9600X"
  cpu_cooler: "Corsair NAUTILUS 360 RS ARGB"
  motherboard: "MSI PRO B850-P WIFI"
  ram: "CORSAIR VENGEANCE RGB DDR5"
  ssd: "TeamGroup NV5000"
  gpu: "PowerColor Reaper RX 9070 16GB"
  case: "Corsair 3200D"
  psu: "Corsair RM650e"

parts_list:
  - part_key: "cpu"
    tab_label: "__AUTO_FROM_PART_KEY__"
    name: "AMD Ryzen 5 9600X"
    section_anchor: "__AUTO_FROM_PART_KEY__"
    image_url: 'https://geekawhat.com/wp-content/uploads/2025/12/MPI_AMD-Ryzen-5-9600X-Box.jpg'
    image_alt: "AMD Ryzen 5 9600X processor retail box"
    summary: "AMD's Ryzen 5 9600X is a strong gaming-focused Zen 5 chip, pairing 6 cores with high single-threaded speed to suit a balanced 1440p build without overspending on the CPU."
    specs:
      - { label: "Cores / Threads", value: "6 Cores / 12 Threads" }
      - { label: "Boost Clock", value: "Up to 5.4GHz" }
      - { label: "Base Clock", value: "3.9GHz" }
      - { label: "Cache", value: "38MB Total Cache" }
      - { label: "TDP", value: "65W" }
    buy_shortcode: '[geeka_price AMAZON-GENIUS-HREF="https://geni.us/BgbCqj" AMAZON-US-ASIN="B0D6NN6TM7" AMAZON-GB-ASIN="B0D6NN6TM7" overclockers-awin-gb-href="https://www.awin1.com/cread.php?awinmid=28821&awinaffid=1167182&ued=https%3A%2F%2Fwww.overclockers.co.uk%2Famd-ryzen-5-9600x-six-core-5.40ghz-socket-am5-processor-retail-pro-amd-02677.html" overclockers-awin-gb-itemid="PRO-AMD-02677"]'

  - part_key: "cpu_cooler"
    tab_label: "__AUTO_FROM_PART_KEY__"
    name: "Corsair NAUTILUS 360 RS ARGB"
    section_anchor: "__AUTO_FROM_PART_KEY__"
    image_url: 'https://geekawhat.com/wp-content/uploads/2026/03/MPI_Corsair-NAUTILUS-360-RS-ARGB-Black.jpg'
    image_alt: "Corsair NAUTILUS 360 RS ARGB liquid CPU cooler"
    summary: "Corsair's 360mm NAUTILUS RS ARGB keeps installation simple with direct motherboard connectivity while still delivering the airflow, static pressure, and radiator size needed for a modern AM5 gaming system."
