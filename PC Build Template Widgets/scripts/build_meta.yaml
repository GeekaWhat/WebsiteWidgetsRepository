# QUICK START
# 1. Set build code and notes.
# 2. Decide which widgets are actually used in this build.
# 3. Keep `widget_enabled` and each section's own `enabled:` value in sync.
# 4. Fill `component_headings` and `parts_list` first.
# 5. For spec widgets, prefer plain-English reader-friendly wording over raw spec-sheet jargon.
# 6. If a term is technical, explain what it does in the wording rather than assuming the reader knows it.
# 7. If something is not used in the build, say that clearly instead of leaving generic text.
#
# STYLE GUIDE
# - Avoid repeating the heading inside the value.
# - Prefer "5G LAN" over "5GbE" for reader-facing copy.
# - Avoid unexplained spec shorthand like "5600-4800 JEDEC" unless you also explain it.
# - Tie cables, slots, and connectors to the exact component they power or affect where helpful.

build_meta:
  build_code: "[BUILD_CODE]"
  refresh_scope: "full"                                       # full | partial
  auto_fill_from_sources: true                                # prefer sources to populate widgets
  auto_fill_policy: "always"                                  # always | when_missing | off
  auto_fill_notes: "Auto-fill any '...' placeholders unless explicitly overridden."
  notes: "..."

formatting_defaults:
  multi_value_separator: "<br>"
  no_commas_for_multi_value_lists: true
  list_item_style: "yaml_array"

part_key_rules:
  allowed_keys: ["cpu","cpu_cooler","motherboard","ram","ssd","gpu","case","psu"]
  tab_label_mode: "auto_from_part_key"                        # set tab_label to "__AUTO_FROM_PART_KEY__" unless override is needed
  section_anchor_mode: "auto_from_part_key"                   # set section_anchor to "__AUTO_FROM_PART_KEY__" unless override is needed
  anchor_style: "lowercase-kebab"                             # examples: #cpu, #cpu-cooler, #motherboard

widget_enabled:
  # High-level widget toggle list for planning.
  # IMPORTANT: keep these values matched with each section's own `enabled:` flag below.
  cpu_comparison_table: true
  cooler_temps_graph: true
  motherboard_specs: true
  ram_widget: true
  ssd_widget: true
  gpu_comparison_table: true
  case_specs: true
  psu_connectors: true
  performance_widget: true
  peripherals: true

