# 10-performance-graph-widget
performance_widget:
  enabled: true
  # widget_id_suffix: '' # optional: leave omitted unless you want a custom HTML id
  kicker: "Performance Snapshot"
  title: "Multi-Game Average FPS"
  driver_bar:
    type: "gpu"                                               # gpu|amd|nvidia
    driver_text: "Driver Version: ..."
  fps_input_mode: "single_line_results"
  raw_results:
    - "Game Name - 0 FPS (@1440p High)"
  strict_mode: true
  rules:
    # Always remove games and/or resolutions that are not present in raw_results.
    keep_only_listed_games: true
    remove_unlisted_games: true
    keep_only_listed_resolutions_per_game: true
    remove_unlisted_resolutions_per_game: true
  settings_policy:
    preserve_default_settings: true
    override_only_if_provided: true
  default_settings_locked:
    # Per-game settings rows shown in widget.
    # For benchmark games that already exist in:
    #   Game-Benchmark-Performance-Widget-Template.html
    # copy the full settings block into the matching YAML key below.
    # Do not leave known games empty unless you intentionally want the minimal fallback.
    # Empty arrays are fallback-only, not the preferred final state.
    # Supported entry formats per game:
    # - { label: "Preset", value: "Ultra" }
    # - ["Preset", "Ultra"]
    # - "Preset: Ultra"
    # If empty and preserve_default_settings=true, renderer auto-adds only:
    # Resolution + "As configured in benchmark run".
    # That fallback is intentionally minimal and should be treated as incomplete
    # whenever richer benchmark settings are available from the benchmark template.
    arcraiders: []
    marvelrivals: []
    battlefield6: []
    callofduty: []
    fortnite: []
    cyberpunk2077: []
    hogwartslegacy: []
    f125: []

