<!--
Monitor colour accuracy graph widget
HTML + JS only (no CSS file), designed to reuse your existing testing widget styles already on page.
-->

<style>
  .gw-testing-widget {
    width: 100%;
    margin: 18px 0;
    padding: 18px;
    border-radius: 16px;
    background: #ffffff;
    box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
    border: 1px solid rgba(0, 0, 0, 0.06);
    box-sizing: border-box;
  }
  .gw-testing-header {
    margin: -18px -18px 14px;
    padding: 10px 14px;
    border-radius: 16px 16px 0 0;
    background: #037cff;
    color: #ffffff;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .gw-testing-title {
    margin: 2px 0 10px;
    font-size: 1.9rem;
    line-height: 1.25;
    font-weight: 700;
  }
  .gw-testing-title a {
    color: inherit;
    text-decoration: none;
  }
  .gw-testing-title a:hover,
  .gw-testing-title a:focus {
    text-decoration: underline;
  }
  .gw-testing-controls {
    display: flex;
    gap: 8px;
    justify-content: space-between;
    margin: 0 0 10px;
  }
  .gw-testing-bench-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin: -4px 0 12px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid #d0e4ff;
    background: #eef5ff;
    color: #1a4ea6;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .gw-testing-nav {
    border: 1px solid #037cff;
    background: #ffffff;
    color: #037cff;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 0.84rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
  }
  .gw-testing-nav:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .gw-testing-nav:hover,
  .gw-testing-nav:focus {
    background: rgba(3, 124, 255, 0.08);
  }
  .gw-testing-carousel {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 100%;
    gap: 10px;
    overflow-x: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
    margin-bottom: 12px;
  }
  .gw-test-slide {
    scroll-snap-align: start;
    border-radius: 12px;
    border: 1px solid #d9e8ff;
    background: #f7faff;
    padding: 12px;
    min-height: 220px;
    box-sizing: border-box;
  }
  .gw-test-embed {
    height: 100%;
    min-height: 370px;
    border: 1px solid #d9e8ff;
    border-radius: 10px;
    background: #ffffff;
    padding: 10px 10px 6px;
    box-sizing: border-box;
  }
  .gw-test-chart-title {
    margin: 0 0 8px;
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.2;
    text-align: center;
  }
  .gw-test-note {
    margin: 8px 0 0;
    font-size: 0.78rem;
    line-height: 1.25;
    opacity: 0.72;
    text-align: center;
  }
  .gw-test-canvas-wrap {
    height: 330px;
    position: relative;
  }
  .gw-chart-fullscreen {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 3;
    border: 1px solid #000000;
    background: #000000;
    color: #ffffff;
    border-radius: 7px;
    width: 34px;
    height: 28px;
    padding: 0;
    font-weight: 700;
    line-height: 1.1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .gw-chart-fullscreen::before {
    content: "⛶";
    font-size: 14px;
    line-height: 1;
  }
  .gw-chart-fullscreen.is-active {
    background: #ffffff;
    color: #000000;
    border-color: #000000;
  }
  .gw-test-embed:fullscreen {
    background: #ffffff;
    padding: 14px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .gw-test-embed:fullscreen .gw-test-canvas-wrap {
    flex: 1 1 auto;
    height: auto;
    min-height: 0;
  }
  .gw-test-embed:fullscreen canvas {
    width: 100% !important;
    height: 100% !important;
  }
  .gw-testing-cta {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #037cff;
    background: #037cff;
    color: #ffffff;
    font-weight: 700;
    font-size: 0.9rem;
    text-decoration: none;
  }
  .gw-testing-cta:hover,
  .gw-testing-cta:focus {
    background: #026fe5;
    border-color: #026fe5;
  }
  @media (max-width: 700px) {
    .gw-testing-widget {
      padding: 14px;
      border-radius: 14px;
    }
    .gw-testing-header {
      margin: -14px -14px 12px;
      border-radius: 14px 14px 0 0;
    }
    .gw-test-slide {
      min-height: 200px;
      padding: 10px;
    }
    .gw-test-embed {
      min-height: 300px;
    }
    .gw-test-canvas-wrap {
      height: 260px;
    }
  }
</style>

<!-- wp:html -->
<section class="gw-testing-widget" id="gw-monitor-colour-widget-v1" aria-label="Monitor colour accuracy testing carousel">
  <p class="gw-testing-header">Monitor Colour Accuracy Testing</p>

  <h3 class="gw-testing-title">DCI-P3 Colour Accuracy Benchmarks</h3>
  <p class="gw-testing-bench-badge">
    <span class="gw-testing-bench-icon"></span> Measured with: SpyderX Pro using SpyderXPro 6.2 software
  </p>


  <div class="gw-test-embed">
    <p class="gw-test-chart-title">DCI-P3 Colour Accuracy — Monitor Comparison</p>
    <p class="gw-test-note">Higher is better.</p>
    <div class="gw-test-canvas-wrap">
      <button type="button" class="gw-chart-fullscreen" aria-label="View DCI-P3 chart fullscreen"></button>
      <canvas class="gw-dcip3-chart" aria-label="DCI-P3 colour accuracy by monitor"></canvas>
    </div>
  </div>
</section>

<script>
  (function () {
    var scriptEl = document.currentScript;
    var root = scriptEl ? scriptEl.previousElementSibling : null;
    if (!root || !root.classList || !root.classList.contains("gw-testing-widget")) {
      root = document.getElementById("gw-monitor-colour-widget-v1");
    }
    if (!root) return;

    function ensureChartJs(done) {
      if (typeof Chart !== "undefined") {
        done();
        return;
      }
      var existing = document.querySelector('script[data-gw-chartjs="1"]');
      if (existing) {
        existing.addEventListener("load", done, { once: true });
        return;
      }
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/chart.js";
      s.async = true;
      s.setAttribute("data-gw-chartjs", "1");
      s.addEventListener("load", done, { once: true });
      document.head.appendChild(s);
    }

    function init() {
      if (root.getAttribute("data-gw-init") === "1") return;
      if (typeof Chart === "undefined") return;
      root.setAttribute("data-gw-init", "1");

      // ── Change this to the monitor name you are reviewing to highlight its bar ──
      var highlightName = "Gigabyte MO27Q28G OLED";

      // ── DCI-P3 Accuracy (sorted best→worst, highest % at top) ──
      var dcip3Labels = [
        "MAG 274QRF QD E2",
        "Gigabyte MO27Q28G OLED",
        "MPG 272URX QD-OLED",
        "AORUS CO49DQ",
        "ASUS ROG Swift OLED PG49WCD",
        "MAG 321CUP QD-OLED",
        "MAG 341CQP QD-OLED",
        "MD271UL",
        "MEG 342C QD-OLED",
        "MPG 274URF QD",
        "MPG 321URX QD-OLED",
        "MSI MAG 272QP QD-OLED X50",
        "ProArt PA279CV",
        "ProArt PA348CGV",
        "AORUS FO32U2P",
        "MPG 321URXW QD-OLED",
        "MPG 322URX QD-OLED",
        "Thermaltake TGM-I27FQ",
        "Cooler Master GM2711S",
        "Cooler Master Tempest GP2711",
        "Cooler Master Tempest GZ2711",
        "MAG 323UPF",
        "MPG 491CQP QD-OLED",
        "ProArt PA32UCXR",
        "ProArt PA32UCR",
        "TUF Gaming VG34WQML5A",
        "ROG STRIX XG27UCG",
        "iiyama G-MASTER GB2790QSU-B1",
        "MAG 274QRFW",
        "MAG 275CQRXF",
        "Thermaltake TGM-V32CQ",
        "iiyama G-MASTER GB3261UHSCP",
        "iiyama G-Master GB3467WQSU-B5",
        "ROG STRIX XG27ACS",
        "Cooler Master GM25FP"
      ];
      var dcip3Accuracy = [99,98,98,97,97,97,97,97,97,97,97,97,97,97,96,96,96,96,95,95,95,95,95,95,94,93,92,91,91,91,91,89,88,87,81];

      function colorByHighlight(labels, focus, base, hi) {
        return labels.map(function (n) { return n === focus ? hi : base; });
      }

      function chartOptions() {
        return {
          indexAxis: "y",
          maintainAspectRatio: false,
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function (ctx) { return "DCI-P3 Accuracy: " + ctx.parsed.x + "%"; }
              }
            }
          },
          scales: {
            x: {
              min: 75,
              max: 100,
              ticks: { callback: function (v) { return v + "%"; }, font: { size: 10 } },
              grid: { color: "rgba(0,0,0,0.08)" }
            },
            y: {
              ticks: { autoSkip: false, font: { size: 10 } },
              grid: { display: false }
            }
          }
        };
      }

      function setChartHeight(canvas, rows) {
        var wrap = canvas && canvas.closest(".gw-test-canvas-wrap");
        if (!wrap) return;
        var minHeight = 330;
        var perRow = 18;
        var target = Math.max(minHeight, rows * perRow + 70);
        wrap.style.height = target + "px";
      }

      var dcip3Ctx = root.querySelector(".gw-dcip3-chart");
      if (dcip3Ctx) {
        setChartHeight(dcip3Ctx, dcip3Labels.length);
        new Chart(dcip3Ctx, {
          type: "bar",
          data: {
            labels: dcip3Labels,
            datasets: [
              {
                label: "DCI-P3 Accuracy",
                data: dcip3Accuracy,
                backgroundColor: colorByHighlight(dcip3Labels, highlightName, "#3c8dff", "#7c3aed")
              }
            ]
          },
          options: chartOptions()
        });
      }

      // ── Carousel navigation ──
      var carousel = root.querySelector(".gw-testing-carousel");
      var slides = carousel ? Array.prototype.slice.call(carousel.querySelectorAll(".gw-test-slide")) : [];
      var prevBtn = root.querySelector(".gw-testing-prev");
      var nextBtn = root.querySelector(".gw-testing-next");
      var idx = 0;

      function updateNav() {
        if (!prevBtn || !nextBtn) return;
        prevBtn.disabled = idx <= 0;
        nextBtn.disabled = idx >= slides.length - 1;
      }

      function goTo(i) {
        idx = Math.max(0, Math.min(slides.length - 1, i));
        if (slides[idx]) slides[idx].scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
        updateNav();
      }

      if (carousel && prevBtn && nextBtn) {
        prevBtn.addEventListener("click", function () { goTo(idx - 1); });
        nextBtn.addEventListener("click", function () { goTo(idx + 1); });
        updateNav();
      }

      // ── Fullscreen ──
      function enterFullscreen(el) {
        if (el.requestFullscreen) return el.requestFullscreen();
        if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
        return Promise.resolve();
      }
      function exitFullscreen() {
        if (document.exitFullscreen) return document.exitFullscreen();
        if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
        return Promise.resolve();
      }

      var fsButtons = root.querySelectorAll(".gw-chart-fullscreen");
      fsButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          var panel = btn.closest(".gw-test-embed");
          if (!panel) return;
          var open = document.fullscreenElement === panel || document.webkitFullscreenElement === panel;
          if (open) exitFullscreen(); else enterFullscreen(panel);
        });
      });

      function syncFs() {
        var active = document.fullscreenElement || document.webkitFullscreenElement;
        fsButtons.forEach(function (btn) {
          var panel = btn.closest(".gw-test-embed");
          var on = panel && active === panel;
          btn.classList.toggle("is-active", !!on);
          btn.setAttribute("title", on ? "Exit fullscreen" : "View chart fullscreen");
        });
      }
      document.addEventListener("fullscreenchange", syncFs);
      document.addEventListener("webkitfullscreenchange", syncFs);
      syncFs();
    }

    ensureChartJs(init);
  })();
</script>
<!-- /wp:html -->
